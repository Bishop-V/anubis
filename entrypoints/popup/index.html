<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Anubis</title>
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="/anubis.svg" alt="" width="30" height="30" />
        <div>
          <h1>Anubis</h1>
          <p id="status"></p>
        </div>
      </div>
      <label class="switch" data-i18n-title="commandToggleEnabled">
        <input id="enabled" type="checkbox" data-i18n-aria-label="popupOnLabel" />
        <span></span>
      </label>
    </header>

    <main>
      <!-- Which of these show depends on the tab: a search page, another site, or neither. -->
      <section id="page" hidden></section>
      <section id="here" hidden></section>

      <section id="add" hidden>
        <h2><label for="domain" data-i18n="popupAddSite">Add a site</label></h2>
        <form id="add-form">
          <input id="domain" type="text" placeholder="fandom.com" autocomplete="off" spellcheck="false" />
          <div class="add-levels" role="group" data-i18n-aria-label="popupRanking">
            <button class="btn small" type="submit" value="hide" data-i18n="levelHide">Hide</button>
            <button class="btn small" type="submit" value="lower" data-i18n="levelLower">Lower</button>
            <button class="btn small" type="submit" value="raise" data-i18n="levelRaise">Raise</button>
            <button class="btn small" type="submit" value="pin" data-i18n="levelPin">Pin</button>
          </div>
        </form>
      </section>

      <section id="recent">
        <h2><span data-i18n="popupYourSites">Your sites</span> <button id="see-all" class="text-btn" type="button"></button></h2>
        <ul id="list"></ul>
      </section>
    </main>

    <footer>
      <button id="lists-summary" class="link-btn" type="button" data-i18n-title="popupOpenLists"></button>
      <button id="add-toggle" class="link-btn" type="button" data-i18n="popupAddSite">Add a site</button>
      <span class="spacer"></span>
      <button id="settings" class="icon-btn" type="button" title="Anubis settings" aria-label="Anubis settings" data-i18n-title="anubisSettings" data-i18n-aria-label="anubisSettings"></button>
      <a id="help" href="https://bishop-v.github.io/anubis/" target="_blank" rel="noopener noreferrer" data-i18n-title="helpTitle" data-i18n="help">Help</a>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
