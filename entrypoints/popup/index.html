<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Anubis</title>
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="/anubis.svg" alt="" width="30" height="30" />
        <div>
          <h1>Anubis</h1>
          <p id="status">On</p>
        </div>
      </div>
      <div class="header-tools">
        <span id="theme"></span>
        <label class="switch" title="Turn Anubis on or off">
          <input id="enabled" type="checkbox" aria-label="Anubis on" />
          <span></span>
        </label>
      </div>
    </header>

    <main>
      <section id="page"></section>

      <section>
        <h2><label for="domain">Weigh a site</label></h2>
        <form id="add-form" class="row">
          <input id="domain" type="text" placeholder="fandom.com" autocomplete="off" spellcheck="false" />
          <select id="level" aria-label="Weight">
            <option value="hide">Hide</option>
            <option value="lower">Lower</option>
            <option value="raise">Raise</option>
            <option value="pin">Pin</option>
          </select>
          <button class="btn primary" type="submit">Add</button>
        </form>
      </section>

      <section>
        <h2>Your sites <span id="count"></span></h2>
        <ul id="list"></ul>
      </section>
    </main>

    <footer>
      <span id="lists-summary" class="muted"></span>
      <span class="spacer"></span>
      <button id="settings" class="text-btn" type="button">Settings</button>
      <a href="https://github.com/Bishop-V/anubis" target="_blank" rel="noopener noreferrer">Source</a>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
