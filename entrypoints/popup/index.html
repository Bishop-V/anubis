<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Anubis</title>
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="/anubis.svg" alt="" width="30" height="30" />
        <div>
          <h1>Anubis</h1>
          <p id="status"></p>
        </div>
      </div>
      <div class="header-tools">
        <span id="theme"></span>
        <label class="switch" data-i18n-title="commandToggleEnabled">
          <input id="enabled" type="checkbox" data-i18n-aria-label="popupOnLabel" />
          <span></span>
        </label>
      </div>
    </header>

    <main>
      <section id="page"></section>
      <section id="here" hidden></section>

      <section>
        <h2><label for="domain" data-i18n="popupAddSite">Add a site</label></h2>
        <form id="add-form" class="row">
          <input id="domain" type="text" placeholder="fandom.com" autocomplete="off" spellcheck="false" />
          <select id="level" data-i18n-aria-label="popupRanking">
            <option value="hide" data-i18n="levelHide">Hide</option>
            <option value="lower" data-i18n="levelLower">Lower</option>
            <option value="raise" data-i18n="levelRaise">Raise</option>
            <option value="pin" data-i18n="levelPin">Pin</option>
          </select>
          <button class="btn primary" type="submit" data-i18n="popupAdd">Add</button>
        </form>
      </section>

      <section>
        <h2><span data-i18n="popupYourSites">Your sites</span> <span id="count"></span></h2>
        <ul id="list"></ul>
      </section>
    </main>

    <footer>
      <span id="lists-summary" class="muted"></span>
      <span class="spacer"></span>
      <button id="settings" class="icon-btn" type="button" title="Anubis settings" aria-label="Anubis settings" data-i18n-title="popupSettings" data-i18n-aria-label="popupSettings"></button>
      <a id="help" href="https://bishop-v.github.io/anubis/" target="_blank" rel="noopener noreferrer" data-i18n-title="helpTitle" data-i18n="help">Help</a>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
