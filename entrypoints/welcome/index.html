<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="welcomeTitle">Welcome to Anubis</title>
  </head>
  <body>
    <main>
      <header>
        <p class="installed">
          <img src="/anubis.svg" alt="" width="28" height="28" />
          <span data-i18n="welcomeHeading">Anubis is installed</span>
        </p>
        <h1 data-i18n="welcomeHeadline">Choose which sites come first in your search results</h1>
        <p class="lead" data-i18n="welcomeLead"></p>
      </header>

      <section class="try" data-i18n-aria-label="welcomeDemoHeading">
        <div id="demo" class="page"></div>
        <p class="after">
          <button id="demo-reset" type="button" class="btn small" data-i18n="welcomeDemoReset" hidden>Start again</button>
        </p>
      </section>

      <section aria-labelledby="more-heading">
        <h2 id="more-heading" data-i18n="welcomeMoreHeading">More to try</h2>
        <p data-i18n="welcomeMoreHow"></p>
        <div class="extras">
          <details id="tags-demo">
            <summary><span class="name" data-i18n="welcomeTagsHeading">Tag sites</span><span class="what" data-i18n="welcomeTagsWhat"></span></summary>
            <div class="extra"></div>
          </details>
          <details id="lists-demo">
            <summary><span class="name" data-i18n="welcomeListsTitle">Subscribe to lists</span><span class="what" data-i18n="welcomeListsWhat"></span></summary>
            <div class="extra"></div>
          </details>
          <details id="panels-demo">
            <summary><span class="name" data-i18n="welcomePanelsHeading">Remove panels</span><span class="what" data-i18n="welcomePanelsWhat"></span></summary>
            <div class="extra"></div>
          </details>
        </div>
      </section>

      <section aria-labelledby="pin-heading">
        <h2 id="pin-heading" data-i18n="welcomePinHeading">Toolbar button</h2>
        <p data-i18n="welcomePinWhy"></p>
        <p id="pin" class="pin">
          <img src="/icon/32.png" alt="" width="20" height="20" />
          <span id="pin-text"></span>
        </p>
      </section>

      <footer>
        <a id="guide" target="_blank" rel="noopener noreferrer" data-i18n="welcomeGuide">Wiki</a>
        <a id="privacy" target="_blank" rel="noopener noreferrer" data-i18n="welcomePrivacy">Privacy</a>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
