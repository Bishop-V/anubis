name: Lists from other projects

# Weekly: rewrites the lists made from other projects' data (lists/sources/)
# with .github/scripts/update-sources.mjs, and opens a pull request labelled
# "sources" (or adds to the one already open), whose diff shows each site added
# or removed. Browsers fetch the merged lists from GitHub on their own schedule,
# so the data stays current between releases.
#
# A list that would lose more than a fifth of its rules isn't rewritten, and the
# run fails so someone looks; the other lists are still updated.
#
# Pull requests opened with the workflow's own token don't start other workflows,
# so this asks CI to run on the branch itself. GitHub only lets a workflow open
# pull requests when Settings → Actions → General → "Allow GitHub Actions to
# create and approve pull requests" is on; without it, this opens an issue.
# GitHub pauses scheduled workflows after 60 days without activity in the repo.

on:
  schedule:
    - cron: '43 5 * * 4' # Thursdays, 05:43 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency: sources-update

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: sources/update
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0 (Node 24)
        with:
          fetch-depth: 0
      - name: Continue the open pull request, if there is one
        id: open
        run: |
          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          echo "number=$number" >> "$GITHUB_OUTPUT"
          if [ -n "$number" ]; then git checkout "$BRANCH"; else git checkout -B "$BRANCH"; fi
      - id: update
        continue-on-error: true
        run: node .github/scripts/update-sources.mjs "$RUNNER_TEMP/pr.md"
      - if: steps.update.outputs.title
        env:
          TITLE: ${{ steps.update.outputs.title }}
          NUMBER: ${{ steps.open.outputs.number }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lists/sources
          git commit -q -m "$TITLE"
          gh label create sources --color d4a637 --description "Lists made from other projects' data" 2>/dev/null || true
          if [ -n "$NUMBER" ]; then
            # The branch may carry fixes pushed since: add to it, never rewrite it.
            git push origin "$BRANCH"
            gh pr comment "$NUMBER" --body-file "$RUNNER_TEMP/pr.md"
          else
            # No open pull request: whatever the branch held before was merged or dropped.
            git push --force origin "$BRANCH"
            if ! gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/pr.md" --label sources; then
              echo "::warning::Couldn't open a pull request; opening an issue instead."
              printf '\n\nThe updated lists are on the [%s branch](%s/compare/main...%s).\n' "$BRANCH" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$BRANCH" >> "$RUNNER_TEMP/pr.md"
              gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/pr.md" --label sources
            fi
          fi
          gh workflow run ci.yml --ref "$BRANCH"
      - if: steps.update.outcome == 'failure'
        run: |
          echo "::error::A source couldn't be fetched or converted, or a list would have lost more than a fifth of its rules. See the update step's log."
          exit 1
