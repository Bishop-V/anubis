name: Engine watch

# Weekly: has uBlacklist changed how it finds results on an engine Anubis
# supports? Its rules (serpinfo/*.yml in ublacklist/builtin) follow the engines'
# markup closely, so a change there is an early warning. Opens an issue labelled
# "engines" listing the new upstream commits; each commit is reported once.
# GitHub pauses scheduled workflows after 60 days without activity in the repo.

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  workflow_dispatch:
    inputs:
      days:
        description: Look back this many days
        default: '10'

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # Ten days for the weekly run, so a late run doesn't miss anything; commits
      # already reported are skipped.
      DAYS: ${{ inputs.days || '10' }}
    steps:
      - uses: actions/checkout@v4
      - run: git clone --filter=blob:none --no-checkout https://github.com/ublacklist/builtin "$RUNNER_TEMP/builtin"
      - name: Collect the issues already opened
        run: gh issue list --label engines --state all --limit 50 --json body --jq '.[].body' > "$RUNNER_TEMP/reported.txt" || true
      - id: watch
        run: node .github/scripts/watch-engines.mjs "$RUNNER_TEMP/builtin" "$RUNNER_TEMP/reported.txt" "$DAYS" "$RUNNER_TEMP/issue.md"
      - if: steps.watch.outputs.title
        env:
          TITLE: ${{ steps.watch.outputs.title }}
        run: |
          gh label create engines --color d4a637 --description "Search engine layouts and selectors" 2>/dev/null || true
          gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/issue.md" --label engines
