name: Docs

# Builds the documentation site (VitePress fails the build on a broken link), checks
# the homepage's layout (e2e/homepage.mjs), and, on main, publishes it to GitHub Pages.
# Publishing needs Pages set to deploy from GitHub Actions: repository Settings →
# Pages → Build and deployment → Source.

on:
  push:
    branches: [main]
    paths: ['docs/**', 'lists/directory.json', 'utils/links.ts', 'package.json', 'package-lock.json', 'e2e/homepage.mjs', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'lists/directory.json', 'utils/links.ts', 'package.json', 'package-lock.json', 'e2e/homepage.mjs', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0 (Node 24)
        with:
          # "Last updated" on each page comes from git history.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1 (Node 24)
        with:
          node-version: 22
          cache: npm
      # No install scripts: npm worms spread through them. wxt prepare is the only one we need.
      - run: npm ci --ignore-scripts
      - run: npx wxt prepare
      - run: npm run docs:build
      - name: Install Chromium for the homepage layout check
        run: npx playwright-core install --with-deps chromium
      - name: Check the homepage layout
        run: node e2e/homepage.mjs
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
