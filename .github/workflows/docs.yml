name: Docs

# Builds the documentation site (VitePress fails the build on a broken link) and,
# on main, publishes it to GitHub Pages. Publishing needs Pages set to deploy from
# GitHub Actions: repository Settings → Pages → Build and deployment → Source.

on:
  push:
    branches: [main]
    paths: ['docs/**', 'lists/directory.json', 'utils/links.ts', 'package.json', 'package-lock.json', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'lists/directory.json', 'utils/links.ts', 'package.json', 'package-lock.json', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (Node 24)
        with:
          # "Last updated" on each page comes from git history.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1 (Node 24)
        with:
          node-version: 22
          cache: npm
      # No install scripts: npm worms spread through them. wxt prepare is the only one we need.
      - run: npm ci --ignore-scripts
      - run: npx wxt prepare
      - run: npm run docs:build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
