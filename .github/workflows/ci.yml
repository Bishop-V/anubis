name: CI

# Type-check, test, build both browsers, and lint the Firefox build. The tests
# parse every file in lists/, so a pull request that adds a site to a list is
# checked too.

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs these same checks before it builds a release.
  workflow_call:
  # engines.yml starts this on the pull requests it opens, which don't start it themselves.
  workflow_dispatch:
    inputs:
      screenshots:
        description: Capture Your sites and the wiki ranking demo
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0 (Node 24)
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.1 (Node 24)
        with:
          node-version: 22
          cache: npm
      # No install scripts: npm worms spread through them. wxt prepare is the only one we need.
      - run: npm ci --ignore-scripts
      - run: npx wxt prepare
      - run: npm run compile
      - run: npm test
      - run: npm run build
      - name: Check Firefox minimum version
        run: node -e "if (require('./.output/firefox-mv2/manifest.json').browser_specific_settings.gecko.strict_min_version !== '142.0') process.exit(1)"
      - run: npm run build:chrome
      - name: Install Chromium for responsive layout checks
        run: npx playwright-core install --with-deps chromium
      - name: Check Settings at phone widths
        run: node e2e/run.mjs responsive
      - name: Check accessibility with axe-core
        run: node e2e/run.mjs axe
      - name: Check popup tag selection and creation
        run: node e2e/run.mjs popup-tags
      - name: Check optional explanations on tagged sites
        run: node e2e/run.mjs tag-notes
      - name: Assert core search-page behavior
        run: node e2e/run.mjs checks
      - run: npx web-ext lint --source-dir .output/firefox-mv2 --warnings-as-errors
      - name: Capture review screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots
        run: |
          npm run docs:build
          node e2e/run.mjs sites
          node e2e/homepage.mjs --screenshots
      - name: Upload review screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anubis-review-screenshots
          path: |
            e2e/shots/your-sites-*.png
            e2e/shots/ranking-demo-*.png
          if-no-files-found: error

  ssx-preview:
    name: English SSX preview
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.screenshots)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0 (Node 24)
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.1 (Node 24)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm --prefix site ci --ignore-scripts
      - run: npm run build:chrome
      - run: npm --prefix site run build
      - run: npx playwright-core install --with-deps chromium
      - run: node e2e/ssx.mjs --screenshots
      - run: node e2e/run.mjs ssx-subscribe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anubis-english-ssx-preview
          path: site/dist/
          if-no-files-found: error
