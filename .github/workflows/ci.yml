name: CI

# Type-check, test, build both browsers and lint the Firefox build. The tests
# parse every file in lists/, so a pull request that adds a site to a list is
# checked too.

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs these same checks before it builds a release.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # No install scripts: npm worms spread through them. wxt prepare is the only one we need.
      - run: npm ci --ignore-scripts
      - run: npx wxt prepare
      - run: npm run compile
      - run: npm test
      - run: npm run build
      - run: npm run build:chrome
      - run: npx web-ext lint --source-dir .output/firefox-mv2 --warnings-as-errors
