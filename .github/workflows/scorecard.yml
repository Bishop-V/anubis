name: Scorecard

# OpenSSF Scorecard grades the repository's supply-chain habits: protected
# branches, pinned actions, a security policy, signed releases, and so on. The
# result is published to scorecard.dev (it feeds the badge in the README) and
# uploaded to the Security tab. Runs when branch protection changes, weekly, and
# on every push to main.

on:
  branch_protection_rule:
  schedule:
    - cron: '41 5 * * 3' # Wednesdays, 05:41 UTC
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      # Uploads the results to the Security tab.
      security-events: write
      # Publishes the results to scorecard.dev, signed with this workflow's identity.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
